# Project-wide Manim defaults. `manim` picks this up automatically when run
# from the project root, so every scene shares the same look without repeating
# config in each file.
[CLI]
# The 3b1b stage: pure black background.
background_color = BLACK

# Smooth motion. 60fps makes transforms and rotating vectors feel fluid.
frame_rate = 60

# Where renders land.
media_dir = ./media

# Keep the frame in the classic 16:9 at a sensible default resolution; the
# -q flag on the command line overrides this per render (l/m/h/k).
pixel_width = 1280
pixel_height = 720
